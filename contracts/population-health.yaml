contract: population-health
version: 1.1.0
title: Population health surveillance — category counts only
purpose: >
  Cross-hospital surveillance of finding categories and their distribution by
  age, sex, and site. Deliberately excludes all free text: the derived
  GenericCategory is released *in place of* the Diagnosis it was extracted
  from, which is the entire reason the labeling pipeline exists.
expires: 2028-01-31

# No released row may describe fewer than five people. Rows are grouped by the
# attributes below — the ones an outsider could already know — and any group
# smaller than k is withheld entirely.
#
# These four were chosen by measuring, not by intuition. On the current data they
# leave 1,984 of 2,700 rows releasable and withhold 716. Adding StudyDate to the
# list would fragment the population into groups of one and suppress everything;
# dropping PatientAge would suppress nothing at all and protect no one.
#
# The withheld rows are disproportionately neonates and anatomical outliers —
# often the cases a rare-disease study most wants. That cost is accepted here
# because this contract exists for population-level surveillance, where no single
# patient should be reachable. A study that genuinely needs the rare cases should
# be a different contract, argued on its own terms.
k_anonymity:
  k: 5
  quasi_identifiers: [PatientSex, InstitutionName, BodyPartExamined, PatientAge]

rules:
  - deny: [PatientName, PatientID, PatientBirthDate, StudyInstanceUID, StudyID,
           FederatedID]
    reason: >
      No row-level identifier of any kind. FederatedID is denied because it
      embeds StudyID verbatim.

  - deny: Diagnosis
    reason: >
      Free-text radiology reports re-identify through incidental detail
      (referring physician, prior dates, rare presentations) that no column
      allowlist can bound.

  - allow: [SourceNode, InstitutionName, Modality, BodyPartExamined,
            StudyDate, PatientSex, PatientAge]

  # Declassifying derivation: lossy by construction, so releasing it while
  # Diagnosis is denied is intended, not a leak. The loader knows the
  # difference — see DERIVED in gateway/contracts/spec.py.
  - allow: [GenericCategory, FindingTags]
    reason: structured, negation-aware extraction with no free text retained
